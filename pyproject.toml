[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sticker-cutter"
version = "0.1.0"
description = "Prepare raster sticker sheets for inkscape-silhouette Print & Cut"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
silhouette = [
  "cssselect>=1.1",
  "inkex>=1.3",
  "libusb1>=3.1",
  "lxml>=4.9",
  "matplotlib>=3.7",
  "pyusb>=1.2",
  "tinycss2>=1.1",
]

[project.scripts]
sticker-cut = "sticker_cut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sticker_cut"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
